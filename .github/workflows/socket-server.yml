name: Socket server CI/CD

# Tests run on every change to socket-server/ (pushes and pull requests).
# A push to main that passes the tests is deployed to the droplet.
on:
  push:
    branches: [main]
    paths:
      - "socket-server/**"
      - ".github/workflows/socket-server.yml"
  pull_request:
    paths:
      - "socket-server/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-server-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socket-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: socket-server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
        # site-deploy on the droplet reads /etc/site-deploy/socket.conf, pulls main, installs, restarts,
        # checks the handshake and rolls back by itself when it is not healthy
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$HOST" "sudo -n /usr/local/sbin/site-deploy socket"
